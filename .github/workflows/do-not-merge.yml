name: Do Not Merge Guard

# Fails while a PR carries the `do-not-merge` label, so the PR cannot be merged
# once this check is marked as required in the main branch protection.
#
# Renovate applies the label to PRs that must never be merged as-is (e.g. a
# PostgreSQL major bump in the CNPG ClusterImageCatalog, see renovate.json).
#
# The job runs on EVERY PR and passes when the label is absent: a required
# check that only ran on some PRs would leave the others waiting forever.
# The label events re-run it, so removing the label turns the check green
# without a new push.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions: {}

jobs:
  do-not-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check for the do-not-merge label
        env:
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'do-not-merge') }}
        run: |
          if [ "${HAS_LABEL}" = "true" ]
          then
            echo "::error title=Do not merge::This PR is labelled 'do-not-merge'. Read the PR description, do what it says instead, then close this PR."
            exit 1
          fi
          echo "No do-not-merge label - OK to merge."
