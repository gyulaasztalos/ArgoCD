apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: unpoller-alerts
  namespace: unpoller  # Must match your Prometheus Operator's namespace
spec:
  groups:
  - name: unpoller.rules
    rules:
    # --- Exporter process health ---------------------------------------
    # Target has disappeared entirely (ServiceMonitor selected nothing / pod gone)
    - alert: unpoller-target-missing
      expr: absent(up{job="unpoller"})
      for: 5m
      labels:
        severity: critical
        namespace: unpoller
        app: unpoller
      annotations:
        summary: "unpoller scrape target is missing"
        description: "Prometheus has no unpoller target (up{job=\"unpoller\"} absent) for 5 minutes — ServiceMonitor or pod issue."
    # Target exists but /metrics scrape is failing
    - alert: unpoller-down
      expr: up{job="unpoller"} == 0
      for: 5m
      labels:
        severity: critical
        namespace: unpoller
        app: unpoller
      annotations:
        summary: "unpoller exporter is down"
        description: "The unpoller /metrics endpoint has been unreachable for the last 5 minutes."
    - alert: unpoller-restart-loop
      expr: increase(kube_pod_container_status_restarts_total{namespace="unpoller", pod=~"unpoller-.*"}[18m]) > 3
      for: 1m
      labels:
        severity: warning
        namespace: unpoller
        app: unpoller
      annotations:
        summary: "unpoller pod is restarting frequently"
        description: "The unpoller pod has restarted more than 3 times in the last 18 minutes."
    # --- Controller reachability (data freshness) ----------------------
    # The exporter can be up while the UniFi controller poll silently fails
    # (bad creds, expired cert, controller reboot, API 429). These catch that.
    # NOTE: verify exact metric names against /metrics once running.
    - alert: unpoller-controller-unreachable
      expr: unpoller_controller_up == 0
      for: 10m
      labels:
        severity: warning
        namespace: unpoller
        app: unpoller
      annotations:
        summary: "unpoller cannot poll the UniFi controller"
        description: "unpoller_controller_up has been 0 for 10 minutes — exporter is running but the last controller poll failed (check creds/cert/controller)."
    - alert: unpoller-data-stale
      expr: unpoller_prometheus_cache_age_seconds > 300
      for: 10m
      labels:
        severity: warning
        namespace: unpoller
        app: unpoller
      annotations:
        summary: "unpoller is serving stale data"
        description: "Last successful controller refresh was over 5 minutes ago (cache_age > 300s) for 10 minutes — metrics are stale."
    # --- Monitored UniFi device health ---------------------------------
    # These watch the DEVICES unpoller polls, not the exporter itself.
    #
    # Added after a Suricata v6->v8 upgrade on the UDM-Pro failed every hour for
    # over a week (184 consecutive INSUFFICIENT_MEMORY events) while the gateway
    # sat at 80-85% memory. Nothing surfaced it: the data was already being
    # collected, it just had no alert attached.
    #
    # Thresholds calibrated against measured baselines on 2026-08-17, after the
    # upgrade: UDMPRO 0.67, U6-Pro 0.60-0.65, USW Pro 24 0.35, U6-IW/Mesh 0.26.
    # The UDM peaked at 0.855 while degraded, so 0.80 sits above every healthy
    # device and below the bad state.
    - alert: unifi-device-memory-high
      expr: unpoller_device_memory_utilization_ratio > 0.80
      for: 30m
      labels:
        severity: warning
        namespace: unpoller
        app: unpoller
      annotations:
        summary: "UniFi device {{ $labels.name }} memory is high"
        description: "{{ $labels.name }} has been above 80% memory for 30 minutes (currently {{ $value | humanizePercentage }}). Healthy baseline is 0.26-0.67 depending on model."
    - alert: unifi-device-memory-critical
      expr: unpoller_device_memory_utilization_ratio > 0.90
      for: 10m
      labels:
        severity: critical
        namespace: unpoller
        app: unpoller
      annotations:
        summary: "UniFi device {{ $labels.name }} is nearly out of memory"
        description: "{{ $labels.name }} has been above 90% memory for 10 minutes (currently {{ $value | humanizePercentage }}). On the UDM-Pro this blocks IDS/IPS engine upgrades and risks earlyoom kills."
    # A real leak raises the FLOOR, not just the peak.
    #
    # The previous version used predict_linear over a 6h window, which
    # extrapolates any upswing of an oscillating signal. On 2026-08-18 it
    # projected >95% while the UDM-Pro was in fact flat at ~65% (verified against
    # sar on the device itself), and the reboot that appeared to confirm it was
    # an unrelated rack-wide power loss when the UPS battery failed.
    #
    # This compares the current 1h floor against the 1h floor six hours earlier.
    # Sawtooth oscillation leaves the floor where it was; a leak lifts it. The
    # device must also already sit above 0.75, so a rising floor low in the
    # range stays quiet.
    #
    # No explicit `> 0` guard is needed here: devices that report exactly 0
    # (USW Flex Mini always, others while rebooting or dropping out of the poll)
    # drag the 1h minimum to 0, which fails the > 0.75 test on its own.
    #
    # Series churn is handled for free — when the exporter pod restarts its
    # `instance` label changes, the offset-6h series no longer matches, the
    # subtraction produces no sample, and the rule simply stays silent rather
    # than extrapolating from a truncated window.
    - alert: unifi-device-memory-exhaustion-predicted
      expr: |
        min_over_time(unpoller_device_memory_utilization_ratio[1h]) > 0.75
        and
        min_over_time(unpoller_device_memory_utilization_ratio[1h])
          - min_over_time(unpoller_device_memory_utilization_ratio[1h] offset 6h) > 0.05
      for: 1h
      labels:
        severity: warning
        namespace: unpoller
        app: unpoller
      annotations:
        summary: "UniFi device {{ $labels.name }} memory floor is rising"
        description: "{{ $labels.name }} shows a rising memory floor: the 1h minimum is now {{ $value | humanizePercentage }} and has climbed more than 5 points in 6 hours. A rising floor indicates a leak rather than normal load variation."
