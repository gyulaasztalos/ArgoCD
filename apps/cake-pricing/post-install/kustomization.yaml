---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Post-install source: only the observability object the scope boundary keeps out
# of the chart. As of common 0.6.0 every mandatory resource — the CNPG Database,
# migrate Job, price-sync CronJob, cake-pricing-headers Middleware and smtp
# ExternalSecret — is rendered by the chart from apps/cake-pricing/values.yaml.
#
#   - prometheus-alarms.yaml   the PrometheusRule
#
# The `labels` transformer stamps the four app.kubernetes.io/* labels on the rule,
# matching the chart's label block.
resources:
  - prometheus-alarms.yaml

labels:
  - pairs:
      app.kubernetes.io/name: cake-pricing
      app.kubernetes.io/part-of: cake-pricing
      app.kubernetes.io/instance: cake-pricing
      app.kubernetes.io/component: cake-pricing
    includeSelectors: false
