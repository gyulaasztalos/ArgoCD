---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cake-pricing
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    # 1) this repo — provides the tailored valueFile (referenced as $config below)
    - repoURL: 'https://github.com/gyulaasztalos/ArgoCD.git'
      targetRevision: main
      ref: config
    # 2) the homelab-charts monorepo — the cake-pricing wrapper chart + `common`.
    #    Renders every mandatory resource (common 0.6.0): the app Deployment,
    #    Service, IngressRoute, the four ExternalSecrets, the ServiceMonitor, the
    #    migrate Job (PreSync hook), the price-sync CronJob, the CNPG Database and
    #    the cake-pricing-headers Middleware.
    - repoURL: 'https://github.com/gyulaasztalos/homelab-charts.git'
      targetRevision: main
      path: charts/cake-pricing
      helm:
        valueFiles:
          - $config/apps/cake-pricing/values.yaml
    # 3) the one object the scope boundary keeps out of the chart: the PrometheusRule
    - repoURL: 'https://github.com/gyulaasztalos/ArgoCD.git'
      targetRevision: main
      path: apps/cake-pricing/post-install
  destination:
    server: https://kubernetes.default.svc
    namespace: cake-pricing
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
