---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-defaults
  namespace: argocd
  annotations:
    # Ahead of everything: these are admission-time defaults, so they need to
    # exist before the workloads they apply to are created.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  # Single-source: hand-written manifests, no upstream chart to wrap.
  sources:
    - repoURL: 'https://github.com/gyulaasztalos/ArgoCD.git'
      targetRevision: main
      path: apps/cluster-defaults/install
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
