---
# Container resource defaults for kube-system.
#
# Without a LimitRange, containers that declare no `resources` land in BestEffort
# QoS: the scheduler cannot account for them and the kernel kills them first
# under pressure. On 8GB rPi 5 nodes running at 70-85% memory that is not
# theoretical. `default`/`defaultRequest` fill in the missing values at admission;
# `min`/`max` bound what a container may ask for.
#
# Previously lived in apps/multus/post-install/ and was owned by the multus
# Application purely because multus happened to be the app targeting kube-system.
# It moved here when multus was decommissioned — see
# resources/unused/multus/README.md.
apiVersion: v1
kind: LimitRange
metadata:
  name: kube-system-resource-limits
  namespace: kube-system
spec:
  limits:
    - type: Container
      # CPU intentionally absent from `max` and `default` — memory keeps both.
      # A CPU limit is a CFS quota per 100ms period, so it throttles bursty
      # containers whose *average* is far below the cap; measured cluster-wide
      # while nodes idled at 8-16% CPU. Requests stay and are what actually
      # allocate CPU under contention (cpu.shares). Rationale in full:
      # apps/metallb/post-install/limitrange.yaml.
      #
      # `max.cpu` is removed together with `default.cpu` and not on its own:
      # LimitRanger rejects a container that sets no limit for a resource that
      # has a `max`, so leaving it would fail admission for every kube-system
      # pod. Memory is incompressible and its limit is the OOM guard — untouched.
      max:
        memory: 512Mi
      min:
        cpu: 10m
        memory: 32Mi
      default:
        memory: 512Mi
      defaultRequest:
        cpu: 10m
        memory: 32Mi
