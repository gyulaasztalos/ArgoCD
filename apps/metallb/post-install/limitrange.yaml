---
apiVersion: v1
kind: LimitRange
metadata:
  name: metallb-system-resource-limits
  namespace: metallb-system
spec:
  limits:
  - type: Container
    max:
      cpu: "1"
      memory: 256Mi
    min:
      cpu: 10m
      memory: 64Mi
    default:
      cpu: 200m
      memory: 256Mi
    defaultRequest:
      cpu: 10m
      memory: 64Mi
