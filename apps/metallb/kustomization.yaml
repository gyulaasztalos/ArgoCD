---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# MetalLB is rendered through kustomize (not ArgoCD's native Helm source) for one
# reason: the frr-k8s subchart hardcodes the frr container's liveness probe as
# `httpGet /livez`, and only kustomize can replace it after Helm has rendered.
# This needs `kustomize.buildOptions: --enable-helm` in argocd-cm
# (apps/argocd/values.yaml). Renovate's kustomize manager bumps `version` below.
helmCharts:
  - name: metallb
    repo: https://metallb.github.io/metallb
    version: 0.16.2
    # Must stay "metallb": it prefixes every resource name (metallb-frr-k8s, ...),
    # and the same name ArgoCD's Helm source used, so nothing gets renamed/pruned.
    releaseName: metallb
    namespace: metallb-system
    valuesFile: values.yaml
    includeCRDs: true

resources:
  - post-install

patches:
  - path: patches/frr-liveness-probe.yaml
