---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cake-order
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    # 1) this repo — provides the tailored valueFile (referenced as $config below)
    - repoURL: 'https://github.com/gyulaasztalos/ArgoCD.git'
      targetRevision: main
      ref: config
    # 2) the homelab-charts monorepo — the cake-order wrapper chart + `common`.
    #    Renders every mandatory resource (common 0.6.0): the app Deployment (with
    #    the gallery-prep initContainer), Service, IngressRoute, NFS gallery PV/PVC,
    #    the three ExternalSecrets, the ServiceMonitor, the migrate Job (PreSync) and
    #    purge CronJob, the CNPG Database, and — as per-chart escape-hatch templates —
    #    the cloudflared tunnel Deployment and the two NetworkPolicies.
    - repoURL: 'https://github.com/gyulaasztalos/homelab-charts.git'
      targetRevision: main
      path: charts/cake-order
      helm:
        valueFiles:
          - $config/apps/cake-order/values.yaml
    # 3) the one object the scope boundary keeps out of the chart: the PrometheusRule
    - repoURL: 'https://github.com/gyulaasztalos/ArgoCD.git'
      targetRevision: main
      path: apps/cake-order/post-install
  destination:
    server: https://kubernetes.default.svc
    namespace: cake-order
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
