---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Post-install source: only the observability object the scope boundary keeps out
# of the chart. As of common 0.6.0 every mandatory resource — the CNPG Database,
# migrate Job, purge CronJob (common contracts), and the cloudflared tunnel +
# NetworkPolicies (per-chart escape-hatch templates) — is rendered by the chart
# from apps/cake-order/values.yaml.
#
#   - prometheus-alarms.yaml   the PrometheusRule
#
# The `labels` transformer stamps the four app.kubernetes.io/* labels on the rule,
# matching the chart's label block.
resources:
  - prometheus-alarms.yaml

labels:
  - pairs:
      app.kubernetes.io/name: cake-order
      app.kubernetes.io/part-of: cake-order
      app.kubernetes.io/instance: cake-order
      app.kubernetes.io/component: cake-order
    includeSelectors: false
