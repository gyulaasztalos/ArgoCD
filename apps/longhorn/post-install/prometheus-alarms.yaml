apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    prometheus: longhorn
    role: alert-rules
  name: prometheus-longhorn-rules
  namespace: longhorn-system
spec:
  groups:
  - name: longhorn.rules
    rules:
    - alert: LonghornVolumeActualSpaceUsedWarning
      annotations:
        description: The actual space used by Longhorn volume {{$labels.volume}} on {{$labels.node}} is at {{$value}}% capacity for
          more than 5 minutes.
        summary: The actual used space of Longhorn volume is over 90% of the capacity.
      expr: (longhorn_volume_actual_size_bytes / longhorn_volume_capacity_bytes) * 100 > 90
      for: 5m
      labels:
        issue: The actual used space of Longhorn volume {{$labels.volume}} on {{$labels.node}} is high.
        severity: warning
        namespace: longhorn-system
        app: longhorn
    - alert: LonghornVolumeStatusCritical
      annotations:
        description: Longhorn volume {{$labels.volume}} on {{$labels.node}} is Fault for
          more than 2 minutes.
        summary: Longhorn volume {{$labels.volume}} is Fault
      expr: longhorn_volume_robustness == 3
      for: 5m
      labels:
        issue: Longhorn volume {{$labels.volume}} is Fault.
        severity: critical
        namespace: longhorn-system
        app: longhorn
    - alert: LonghornVolumeStatusWarning
      annotations:
        description: Longhorn volume {{$labels.volume}} on {{$labels.node}} is Degraded for
          more than 5 minutes.
        summary: Longhorn volume {{$labels.volume}} is Degraded
      expr: longhorn_volume_robustness == 2
      for: 5m
      labels:
        issue: Longhorn volume {{$labels.volume}} is Degraded.
        severity: warning
        namespace: longhorn-system
        app: longhorn
    - alert: LonghornNodeStorageWarning
      annotations:
        description: The used storage of node {{$labels.node}} is at {{$value}}% capacity for
          more than 5 minutes.
        summary:  The used storage of node is over 90% of the capacity.
      expr: (longhorn_node_storage_usage_bytes / longhorn_node_storage_capacity_bytes) * 100 > 90
      for: 5m
      labels:
        issue: The used storage of node {{$labels.node}} is high.
        severity: warning
        namespace: longhorn-system
        app: longhorn
    - alert: LonghornDiskStorageWarning
      annotations:
        description: The used storage of disk {{$labels.disk}} on node {{$labels.node}} is at {{$value}}% capacity for
          more than 5 minutes.
        summary:  The used storage of disk is over 90% of the capacity.
      expr: (longhorn_disk_usage_bytes / longhorn_disk_capacity_bytes) * 100 > 90
      for: 5m
      labels:
        issue: The used storage of disk {{$labels.disk}} on node {{$labels.node}} is high.
        severity: warning
        namespace: longhorn-system
        app: longhorn
    - alert: LonghornNodeDown
      annotations:
        description: There are {{$value}} Longhorn nodes which have been offline for more than 5 minutes.
        summary: Longhorn nodes is offline
      expr: (avg(longhorn_node_count_total) or on() vector(0)) - (count(longhorn_node_status{condition="ready"} == 1) or on() vector(0)) > 0
      for: 5m
      labels:
        issue: There are {{$value}} Longhorn nodes are offline
        severity: critical
        namespace: longhorn-system
        app: longhorn
    - alert: LonghornInstanceManagerCPUUsageWarning
      annotations:
        description: Longhorn instance manager {{$labels.instance_manager}} on {{$labels.node}} has CPU Usage / CPU request is {{$value}}% for
          more than 5 minutes.
        summary: Longhorn instance manager {{$labels.instance_manager}} on {{$labels.node}} has CPU Usage / CPU request is over 300%.
      expr: (longhorn_instance_manager_cpu_usage_millicpu/longhorn_instance_manager_cpu_requests_millicpu) * 100 > 300
      for: 5m
      labels:
        issue: Longhorn instance manager {{$labels.instance_manager}} on {{$labels.node}} consumes 3 times the CPU request.
        severity: warning
        namespace: longhorn-system
        app: longhorn
    - alert: LonghornNodeCPUUsageWarning
      annotations:
        description: Longhorn node {{$labels.node}} has CPU Usage / CPU capacity is {{$value}}% for
          more than 5 minutes.
        summary: Longhorn node {{$labels.node}} experiences high CPU pressure for more than 5m.
      expr: (longhorn_node_cpu_usage_millicpu / longhorn_node_cpu_capacity_millicpu) * 100 > 90
      for: 5m
      labels:
        issue: Longhorn node {{$labels.node}} experiences high CPU pressure.
        severity: warning
        namespace: longhorn-system
        app: longhorn

  # --- Backup coverage -------------------------------------------------
  # Added 2026-08-04 after volume backups silently stopped for 5 days: one
  # volume's backup hung at 0% and, because the RecurringJob's CronJob is
  # concurrencyPolicy: Forbid with no activeDeadlineSeconds, the hung run
  # blocked every subsequent nightly run. Nothing above this group would have
  # noticed — the existing alerts cover space, robustness and node health only.
  #
  # Metric semantics verified against the live cluster:
  #   longhorn_backup_state       2 = InProgress, 3 = Completed
  #                               (labels: backup, volume, recurring_job)
  #   longhorn_volume_last_backup_at   unix seconds; 0 = never backed up
  #                               (labels: volume, pvc, pvc_namespace, node)
  # A healthy full run backs up every volume in ~6 minutes.
  - name: longhorn-backup.rules
    rules:
    # The exact failure that happened. Per-volume backups finish in well under
    # a minute, so anything still InProgress after an hour is wedged, not slow.
    - alert: LonghornBackupStuck
      annotations:
        description: Longhorn backup {{$labels.backup}} of volume {{$labels.volume}} has been InProgress for over 1h. A healthy backup completes in under a minute. It is blocking every later run of the {{$labels.recurring_job}} job (concurrencyPolicy Forbid).
        summary: Longhorn backup of {{$labels.volume}} is stuck
      expr: longhorn_backup_state == 2
      for: 1h
      labels:
        severity: critical
        namespace: longhorn-system
        app: longhorn

    # Backups stopped altogether. Uses max() across all volumes so it fires on
    # "the nightly job is not running", independent of which volumes are in the
    # backup groups. 36h = the daily schedule plus a 12h grace period.
    - alert: LonghornNoRecentBackup
      annotations:
        description: No Longhorn volume has been backed up in over 36h. The daily 02:00 backup job is not completing — check for a stuck backup and a blocked CronJob in longhorn-system.
        summary: No Longhorn backup has completed in 36h
      expr: time() - max(longhorn_volume_last_backup_at) > 129600
      for: 30m
      labels:
        severity: critical
        namespace: longhorn-system
        app: longhorn

    # A single volume falling out of the rotation while others keep working.
    # Volumes that have never been backed up (value 0) are excluded on purpose —
    # not every volume is in the default/temp backup groups.
    - alert: LonghornVolumeBackupStale
      annotations:
        description: Volume {{$labels.volume}} ({{$labels.pvc_namespace}}/{{$labels.pvc}}) has not been backed up for over 48h while other volumes have. It may have dropped out of the backup group.
        summary: Longhorn volume {{$labels.pvc}} has a stale backup
      expr: longhorn_volume_last_backup_at != 0 and time() - longhorn_volume_last_backup_at > 172800
      for: 30m
      labels:
        severity: warning
        namespace: longhorn-system
        app: longhorn

    # Direct read of the CronJobs the RecurringJobs generate. Catches the
    # Forbid-blocking case even if the Longhorn metrics themselves go missing.
    #
    # This covers ALL five Longhorn recurring jobs, not just the backup, because
    # the failure mode is a property of how Longhorn drives them rather than of
    # backups specifically: concurrencyPolicy Forbid, no activeDeadlineSeconds,
    # and failedJobsHistoryLimit 1 which can GC the Job while its pod keeps
    # running — orphaning the pod and letting a second one start alongside it.
    #
    # Snapshots get no dedicated alert of their own because Longhorn exposes no
    # snapshot state or age metric (only longhorn_snapshot_actual_size_bytes),
    # so there is no equivalent of longhorn_volume_last_backup_at to alert on.
    # The CronJob success timestamp is the only usable signal for them.
    #
    # Thresholds are ~2 missed runs plus grace, per cadence.
    - alert: LonghornRecurringJobNotSucceeding4h
      annotations:
        description: CronJob {{$labels.cronjob}} runs every 4h but has not completed successfully in over 9h. Check for an orphaned recurring-job pod holding the slot — `kubectl get pods -n longhorn-system` and look for one whose Job no longer exists.
        summary: Longhorn 4-hourly job {{$labels.cronjob}} is not succeeding
      expr: time() - kube_cronjob_status_last_successful_time{namespace="longhorn-system", cronjob="hourly-volume-snapshot"} > 32400
      for: 30m
      labels:
        severity: warning
        namespace: longhorn-system
        app: longhorn

    - alert: LonghornRecurringJobNotSucceedingDaily
      annotations:
        description: CronJob {{$labels.cronjob}} runs daily but has not completed successfully in over 36h. With concurrencyPolicy Forbid a single hung run suppresses all later ones indefinitely — there is no activeDeadlineSeconds to break the deadlock.
        summary: Longhorn daily job {{$labels.cronjob}} is not succeeding
      expr: time() - kube_cronjob_status_last_successful_time{namespace="longhorn-system", cronjob=~"daily-volume-backup|extra-filesystem-trim"} > 129600
      for: 30m
      labels:
        severity: critical
        namespace: longhorn-system
        app: longhorn

    - alert: LonghornRecurringJobNotSucceedingWeekly
      annotations:
        description: CronJob {{$labels.cronjob}} runs weekly but has not completed successfully in over 9 days.
        summary: Longhorn weekly job {{$labels.cronjob}} is not succeeding
      expr: time() - kube_cronjob_status_last_successful_time{namespace="longhorn-system", cronjob=~"weekly-filesystem-trim|weekly-system-backup"} > 777600
      for: 30m
      labels:
        severity: warning
        namespace: longhorn-system
        app: longhorn
