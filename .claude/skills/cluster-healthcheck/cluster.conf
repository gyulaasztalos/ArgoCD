# =============================================================================
# cluster.conf — everything cluster-specific the healthcheck scripts need.
#
# Sourced by scripts/*.sh (bash). Adapting the skill to another cluster starts
# here: run scripts/discover.sh, copy its suggestions into this file, and see
# ADAPTING.md for the rest (baselines, known issues, SKILL.md wording).
#
# To keep a fork's values out of the shared file, point HEALTHCHECK_CONF at a
# private copy instead:  HEALTHCHECK_CONF=~/my-cluster.conf healthcheck.sh
# =============================================================================

# --- Nodes -------------------------------------------------------------------
# Space-separated "name:address" pairs. The name must equal the Kubernetes node
# name. The address is used for ssh, and to turn apiserver/etcd metric
# instances (address:port) into node names in the output. Order is cosmetic.
NODES="archer:10.10.50.21 lana:10.10.50.22 pam:10.10.50.23 cheryl:10.10.50.24"

# PromQL label matcher selecting the cluster's node-exporter series. Here the
# `instance` label is the node name; on many clusters it is "<ip>:9100"
# instead. discover.sh shows which, and suggests the matcher.
NODE_EXPORTER_SELECTOR='instance=~"archer|lana|pam|cheryl"'

# --- Node access (kernel-log section) -----------------------------------------
# Read-only ssh to each node for journalctl. Set SSH_ENABLED=0 when there is
# no ssh access (managed nodes, Talos, ...); that section is then skipped.
SSH_ENABLED=1
SSH_USER="red"

# --- Prometheus (reached through the apiserver service proxy) -----------------
PROM_NAMESPACE="monitoring"
PROM_SERVICE="monitoring-kube-prometheus-prometheus"
PROM_PORT="9090"
# Retention caps the longest window the battery can look at (days).
PROM_RETENTION_DAYS=5

# --- GitOps ---------------------------------------------------------------------
ARGOCD_NAMESPACE="argocd"
# Branch the cluster deploys from; the battery lists merges to it.
GIT_BRANCH="origin/main"

# --- Optional components (1 = check, 0 = skip the section) ---------------------
CHECK_LONGHORN=1
LONGHORN_NAMESPACE="longhorn-system"
# Recurring-job group whose volumes get the regular backup, and how old the
# newest backup of each may be before it counts as stale (hours).
LONGHORN_BACKUP_GROUP="default"
LONGHORN_BACKUP_MAX_AGE_H=26

CHECK_CNPG=1

# frr-k8s (MetalLB in FRR-K8s mode) BGP session metric.
CHECK_BGP=1

# --- Baseline hints -------------------------------------------------------------
# Printed next to the matching battery sections as a reading aid. They are this
# cluster's numbers (4× Pi 5 8GB, k3s, ~2,400 watches); the full table with
# reasoning lives in references/known-issues.md. Empty = no hint printed.
HINT_WATCHES="healthy 500–1,100 each; >1,400 sustained = imbalance"
HINT_APISERVER_RSS="healthy 2.0–2.8; warn >3.5; incident ~5"
HINT_ETCD_FSYNC="healthy <0.03"
HINT_MEMAVAILABLE="control plane healthy 1.6–2.5; <1.2 warn; <1.0 eviction territory"
HINT_MAJFAULT="normal <100; >300 sustained = thrash"
# Major-fault rate above which the battery lists the exact moments.
MAJFAULT_THRESHOLD=300
